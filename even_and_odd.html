<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		<style>
			#btn_showNumbers {
				height: 80px;
				font-size: 24px;
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<button id="btn_showNumbers">Show Numbers From 1 to 20</button>
		<ul id="ul_list"></ul>
		<script>
			const showNumbers = document.getElementById("btn_showNumbers");
			const ulList = document.getElementById("ul_list");
			showNumbers.addEventListener("click", function() {
				ulList.innerHTML = "";
				for (let i = 1; i <= 20; i++) {
					const singleLi = document.createElement("li");
					if(i % 2 === 0){
						singleLi.textContent = "Even: " + i;
						singleLi.style.backgroundColor = "#f0f0f0";
					}else{
						singleLi.textContent = "Odd: " + i;
					}
					ulList.appendChild(singleLi);
				}
			});
		</script>
	</body>
</html>
