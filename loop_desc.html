<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
	</head>
	<body>
		<button id="btn_showDesc">Click</button>
		<script>
			let number = 11;
			function showDesc () {
				if (number > 0) {
					number--;
				}
				return number;
			}
			const btn = document.getElementById("btn_showDesc");
			btn.addEventListener("click", function() {
				const new_p = document.createElement("p");
				showDesc();
				new_p.textContent = number;
				document.body.appendChild(new_p);
			});
		</script>
	</body>
</html>
