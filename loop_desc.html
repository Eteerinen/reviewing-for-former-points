<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Loop Desc</title>
	</head>
	<body>
		<div id="div_container"></div>
		<button id="btn_showDesc">Click</button>
		<script>
			const btn = document.getElementById("btn_showDesc");
			const container = document.getElementById("div_container")
			btn.addEventListener("click", function() {
				for (let i = 10; i >= 0; i--) {
					const new_p = document.createElement("p");
					if (i === 0) {
						new_p.textContent = "Liftoff!";
					}else{
						new_p.textContent = i;
					}
					container.appendChild(new_p);
				}
			});
		</script>
	</body>
</html>
