<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Loop Desc</title>
	</head>
	<body>
		<button id="btn_showDesc">Click</button>
		<script>
			const btn = document.getElementById("btn_showDesc");
			btn.addEventListener("click", function() {
				for (let i = 10; i > 0; i--) {
					const new_p = document.createElement("p");
					new_p.textContent = i;
					document.body.appendChild(new_p);
				}
			});
		</script>
	</body>
</html>
