<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
	</head>
	<body>
		<button id="btn_showSum"><h2>Show Sum</h2></button>
		<button id="btn_showAverage"><h2>Show Average</h2></button>
		<div>
			<h1>Result of Addition: </h1>
			<div id="div_resultsOfSum"></div>
			<h1>Result of Average: </h1>
			<div id="div_resultsOfAverage"></div>
		</div>
		<script>
			let array = [4, 8, 15, 16, 23, 42];
			const getSum = document.getElementById("btn_showSum");
			const getAverage = document.getElementById("btn_showAverage");
			const resultBoxSum = document.getElementById("div_resultsOfSum");
			const resultBoxAverage = document.getElementById("div_resultsOfAverage");
			getSum.addEventListener("click", function() {
				resultBoxSum.innerHTML = "";
				let sum = 0;
				for (let i = 0; i < array.length; i++) {
					sum = sum + array[i];
				}
				const resultSum = document.createElement("h2");
				resultSum.textContent = sum;
				resultBoxSum.appendChild(resultSum);
			});
			getAverage.addEventListener("click", function() {
				resultBoxAverage.innerHTML = "";
				let sum = 0;
				let average = 0;
				for (let i = 0; i < array.length; i++) {
					sum = sum + array[i];
				}
				average = sum / array.length;
				const resultAverage = document.createElement("h2");
				resultAverage.textContent = average;
				resultBoxAverage.appendChild(resultAverage);
			});
		</script>
	</body>
</html>
